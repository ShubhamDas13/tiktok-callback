<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TikTok login</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0e0f1a; color: #eef0ff;
         display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  main { max-width: 560px; width: 100%; }
  code { display: block; word-break: break-all; background: #1f2340; padding: 10px; border-radius: 8px; font-size: 13px; }
  button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Finishing TikTok login…</h1>
  <p id="msg">Sending you back to your AutoVid dashboard.</p>
  <div id="manual" hidden>
    <p>If nothing happened, copy this address and paste it into the dashboard's Accounts tab under <b>Paste the address you landed on</b>:</p>
    <code id="url"></code>
    <button id="copy">Copy</button>
  </div>
</main>
<script>
  // TikTok requires an https redirect URI, so it sends you here first. This page forwards the
  // ?code=...&state=... to the dashboard running on your own computer. It stores nothing.
  var DASHBOARD = "http://127.0.0.1:5050/oauth/tiktok/callback";
  var q = location.search;
  document.getElementById("url").textContent = location.href;
  document.getElementById("copy").onclick = function () { navigator.clipboard && navigator.clipboard.writeText(location.href); this.textContent = "Copied"; };
  if (/[?&](code|error)=/.test(q)) {
    setTimeout(function () { document.getElementById("manual").hidden = false; }, 2500);
    location.replace(DASHBOARD + q);
  } else {
    document.getElementById("msg").textContent = "This page is only used during TikTok login.";
  }
</script>
</body>
</html>
